<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <title>{% block title %}ContentAI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: #fff; }
        .btn-gradient:hover { opacity: 0.9; color: #fff; }
        footer { margin-top: auto; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand gradient-text" href="/">ContentAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links"></ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark border-top border-secondary py-3 text-center text-muted">
        <div class="container">
            <small>ContentAI &copy; 2026 &mdash; AI-Powered Social Media Content Assistant</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getToken() { return localStorage.getItem('access_token'); }
        function setToken(access, refresh) {
            localStorage.setItem('access_token', access);
            localStorage.setItem('refresh_token', refresh);
        }
        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
        }
        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }
        var _origFetch = window.fetch;
        async function tryRefreshToken() {
            const rt = localStorage.getItem('refresh_token');
            if (!rt) return false;
            try {
                const r = await _origFetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: rt })
                });
                if (!r.ok) return false;
                const d = await r.json();
                localStorage.setItem('access_token', d.access_token);
                if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
                return true;
            } catch (e) { return false; }
        }
        (function autoRefreshOn401() {
            window.fetch = async function (url, options) {
                const opts = options || {};
                const res = await _origFetch(url, opts);
                if (res.status === 401 && getToken() && String(url).startsWith('/api/')) {
                    if (await tryRefreshToken()) {
                        const headers = Object.assign({}, opts.headers || {});
                        headers['Authorization'] = 'Bearer ' + getToken();
                        return _origFetch(url, Object.assign({}, opts, { headers: headers }));
                    }
                }
                return res;
            };
        })();
        function updateNav() {
            const nav = document.getElementById('nav-links');
            const token = getToken();
            const publicPages = ['/', '/login', '/register'];
            const isPublic = publicPages.includes(window.location.pathname);
            if (token) {
                if (isPublic) {
                    clearTokens();
                }
                nav.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item" id="admin-link" style="display:none"><a class="nav-link" href="/admin"><i class="bi bi-shield-lock"></i> Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="clearTokens(); window.location.href='/login';"><i class="bi bi-box-arrow-right"></i> Logout</a></li>`;
                if (!isPublic) {
                    fetch('/api/auth/me', { headers: authHeaders() }).then(r => {
                        if (!r.ok) { clearTokens(); window.location.href = '/login'; return null; }
                        return r.json();
                    }).then(user => {
                        if (user && user.is_admin) document.getElementById('admin-link').style.display = '';
                    }).catch(() => {});
                }
            } else {
                nav.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-gradient btn-sm ms-2 px-3" href="/register">Sign Up</a></li>`;
            }
        }
        updateNav();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
